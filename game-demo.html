<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .console {
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 2px solid #333;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        input {
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            text-align: center;
            width: 100px;
        }
        .info {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Number Guessing Game</h1>
        
        <div class="console" id="console">
            <div>🎮 Welcome to the Number Guessing Game!</div>
            <div>═══════════════════════════════════════════════════</div>
            <div>🎯 Try to guess the secret number!</div>
            <div>💡 Use the buttons below to interact with the game</div>
            <div>🚀 Click "Start New Game" to begin!</div>
        </div>
        
        <div class="controls">
            <button onclick="startGame()">🆕 Start New Game</button>
            <input type="number" id="guessInput" placeholder="Your guess" min="1">
            <button onclick="makeGuess()">🎯 Guess</button>
            <button onclick="showStats()">📊 Stats</button>
            <button onclick="showHelp()">❓ Help</button>
            <button onclick="autoPlay()">🤖 Auto Play</button>
        </div>
        
        <div class="controls" style="margin-top: 10px;">
            <button onclick="setDifficulty('easy')">🟢 Easy</button>
            <button onclick="setDifficulty('medium')">🟡 Medium</button>
            <button onclick="setDifficulty('hard')">🔴 Hard</button>
        </div>
        
        <div class="info">
            <p>🎲 Current Difficulty: <span id="currentDifficulty">MEDIUM</span></p>
        </div>
    </div>

    <script src="number-guessing-game.js"></script>
    <script>
        // Create a new game instance for the browser
        const browserGame = new NumberGuessingGame();
        const consoleDiv = document.getElementById('console');
        const difficultySpan = document.getElementById('currentDifficulty');
        
        // Override console.log to display in our custom console
        const originalConsoleLog = console.log;
        console.log = function(...args) {
            const message = args.join(' ');
            const div = document.createElement('div');
            div.textContent = message;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            originalConsoleLog.apply(console, args);
        };
        
        function startGame() {
            browserGame.startNewGame();
        }
        
        function makeGuess() {
            const input = document.getElementById('guessInput');
            const guess = parseInt(input.value);
            if (!isNaN(guess)) {
                browserGame.guess(guess);
                input.value = '';
            } else {
                console.log('❌ Please enter a valid number');
            }
        }
        
        function showStats() {
            browserGame.showStats();
        }
        
        function showHelp() {
            browserGame.showHelp();
        }
        
        function autoPlay() {
            browserGame.autoPlay();
        }
        
        function setDifficulty(level) {
            browserGame.setDifficulty(level);
            difficultySpan.textContent = level.toUpperCase();
        }
        
        // Allow Enter key to make a guess
        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                makeGuess();
            }
        });
        
        // Initialize the display
        console.log('🌐 Browser version loaded! Use the buttons to play.');
    </script>
</body>
</html>
